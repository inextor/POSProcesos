<div class="search-container">
	<div class="input-group">
		<input type="text"
			class="form-control"
			[placeholder]="input_placeholder"
			autocomplete="off"
			[ngModel]="search_str"
			(ngModelChange)="onInputChange($event)"
			(focus)="onSearchFocus()"
			(blur)="onSearchBlur()"
			(keydown)="onSearchKeydown($event)">
		@if (is_searching) {
			<span class="input-group-text">
				<span class="spinner-border spinner-border-sm" role="status"></span>
			</span>
		}
		@if (search_str) {
			<button type="button" class="btn btn-outline-secondary" (mousedown)="$event.preventDefault(); onClearSearch()">
				<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><path fill="currentColor" d="M19 6.41L17.59 5L12 10.59L6.41 5L5 6.41L10.59 12L5 17.59L6.41 19L12 13.41L17.59 19L19 17.59L13.41 12z"/></svg>
			</button>
		}
	</div>
	@if (show_dropdown && found_items.length) {
		<div class="search-dropdown border bg-white">
			@for(item of found_items; track item.id; let i = $index) {
				<div class="search-item px-2 py-1 border-bottom"
					[class.active]="selected_index === i"
					(mousedown)="$event.preventDefault(); onSelectItem(item)">
					<div>{{item.label}}</div>
					@if (item.code) {
						<small class="text-muted">{{item.code}}</small>
					}
				</div>
			}
		</div>
	}
	@if (show_dropdown && !found_items.length && !is_searching && searched_once) {
		<div class="search-dropdown border bg-white">
			<div class="px-2 py-1 text-muted">Sin resultados</div>
		</div>
	}
</div>
